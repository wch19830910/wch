name: Update MiHome

on:
  schedule:
    - cron: '33 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - Surge/scripts/build-mihome.mjs
      - Surge/tests/mihome.test.mjs
      - .github/workflows/update-mihome.yml

permissions:
  contents: write

concurrency:
  group: mihome-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 读取默认分支
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: 准备 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: 检查构建环境
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            echo '工作目录包含非预期变更，停止更新。'
            exit 1
          fi
          node --check Surge/scripts/build-mihome.mjs
          node --check Surge/tests/mihome.test.mjs
      - name: 检查奶思米家上游并构建
        run: node Surge/scripts/build-mihome.mjs
      - name: 验证广告范围与更新保护
        run: node Surge/tests/mihome.test.mjs
      - name: 只发布通过验证的模块和来源快照
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          while IFS= read -r change; do
            [[ -z "$change" ]] && continue
            case "${change:3}" in
              Surge/AdBlock/MiHome.sgmodule|Surge/upstream/MiHome.sgmodule) ;;
              *) echo "发现非预期变更，停止发布：${change:3}"; exit 1 ;;
            esac
          done < <(git status --porcelain=v1 --untracked-files=all)
          git add -- Surge/AdBlock/MiHome.sgmodule Surge/upstream/MiHome.sgmodule
          if git diff --cached --quiet; then
            echo '上游内容无变化。'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: sync MiHome upstream'
          for attempt in 1 2 3; do
            git pull --rebase origin "${DEFAULT_BRANCH}"
            if git push origin "HEAD:${DEFAULT_BRANCH}"; then
              exit 0
            fi
            if [[ "$attempt" == 3 ]]; then
              echo '发布重试达到上限，停止；不强制推送。'
              exit 1
            fi
          done
