name: Update Tieba

on:
  schedule:
    - cron: '13 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - Surge/scripts/build-tieba.mjs
      - Surge/tests/tieba.test.mjs
      - .github/workflows/update-tieba.yml

permissions:
  contents: write

concurrency:
  group: tieba-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 读取默认分支
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: 准备 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: 检查构建环境
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            echo '工作目录包含非预期变更，停止更新。'
            exit 1
          fi
          jq --version
          node --check Surge/scripts/build-tieba.mjs
          node --check Surge/tests/tieba.test.mjs
      - name: 检查双上游并构建贴吧模块
        run: node Surge/scripts/build-tieba.mjs
      - name: 验证接口覆盖、页面净化和视频默认设置
        run: node Surge/tests/tieba.test.mjs
      - name: 只发布通过验证的模块和配置快照
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          while IFS= read -r change; do
            [[ -z "$change" ]] && continue
            case "${change:3}" in
              Surge/AdBlock/Tieba.sgmodule|Surge/upstream/Tieba.app2smile.sgmodule|Surge/upstream/Tieba.ddgksf2013.conf|Surge/upstream/Tieba.ad.list) ;;
              *) echo "发现非预期变更，停止发布：${change:3}"; exit 1 ;;
            esac
          done < <(git status --porcelain=v1 --untracked-files=all)
          git add -- Surge/AdBlock/Tieba.sgmodule Surge/upstream/Tieba.app2smile.sgmodule Surge/upstream/Tieba.ddgksf2013.conf Surge/upstream/Tieba.ad.list
          if git diff --cached --quiet; then
            echo '上游内容无变化。'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: sync Tieba upstream'
          for attempt in 1 2 3; do
            git pull --rebase origin "${DEFAULT_BRANCH}"
            if git push origin "HEAD:${DEFAULT_BRANCH}"; then
              exit 0
            fi
            if [[ "$attempt" == 3 ]]; then
              echo '发布重试达到上限，停止；不强制推送。'
              exit 1
            fi
          done
